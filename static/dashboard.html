<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель управления</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Колледж: Заказ справок</span>
      <span class="navbar-text text-light me-3" id="userName"></span>
      <button class="btn btn-outline-light btn-sm" onclick="logout()">Выйти</button>
    </div>
  </nav>

  <div class="container" id="appContent">
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/dashboard.js"></script>
  <script>
    (async () => {
      if (!localStorage.getItem('access_token')) {
        window.location.replace('/static/login.html');
        return;
      }
      try {
        const user = await apiRequest('/users/me', 'GET');
        document.getElementById('userName').textContent = user.full_name + ' (' + (user.role === 'staff' ? 'Сотрудник' : 'Студент') + ')';
        if (user.role === 'student') {
          renderStudentDashboard();
        } else {
          renderStaffDashboard();
        }
        loadOrders(user.role);
      } catch (err) {
        console.error(err);
        if (err.status === 401) {
          localStorage.removeItem('access_token');
          window.location.replace('/static/login.html');
        }
      }
    })();
  </script>
</body>
</html>
